:root{--ink:#111214;--sub:#6b6e75;--dim:#a3a6ac;--rule:#e4e5e8;--acc:#3762cf;--g:48px;
 --disp:'Disp','Kr',system-ui,sans-serif;--kr:'Kr',system-ui,sans-serif;--mono:'Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff;color:var(--ink);font-family:var(--kr);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:hidden}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.head{padding:clamp(36px,7vh,72px) var(--g) 0;display:grid;grid-template-columns:1fr auto;align-items:center;gap:40px}
h1{font-weight:700;font-size:clamp(34px,4.3vw,62px);line-height:1.16;letter-spacing:-.045em}
.lead{margin-top:20px;font-size:clamp(15px,1.25vw,18px);color:var(--sub);letter-spacing:-.02em}
/* blob-tracking style accent on "AI" */
.trk{position:relative;display:inline-block;padding:0 .14em;margin:0 .2em 0 .02em;font-family:var(--disp);font-weight:800;letter-spacing:-.03em}
.trk::before{content:"";position:absolute;inset:.08em 0 .02em;border:1.5px solid var(--ink)}
.trk i{position:absolute;width:9px;height:9px;background:#fff;border:1.5px solid var(--ink)}
.trk i:nth-of-type(1){left:-5px;top:calc(.08em - 5px)}.trk i:nth-of-type(2){right:-5px;top:calc(.08em - 5px)}
.trk i:nth-of-type(3){left:-5px;bottom:calc(.02em - 5px)}.trk i:nth-of-type(4){right:-5px;bottom:calc(.02em - 5px)}
.trk b{position:absolute;left:0;bottom:calc(100% + 4px);font:500 11px/1 var(--mono);letter-spacing:.08em;color:var(--ink);white-space:nowrap}
.trk em{position:absolute;left:calc(100% + 10px);top:.18em;font:500 10px/1.5 var(--mono);font-style:normal;letter-spacing:.06em;color:var(--dim);white-space:nowrap}
.trk em::before{content:"";position:absolute;left:-10px;top:.7em;width:7px;border-top:1px solid var(--dim)}
@media (max-width:1100px){.trk em{display:none}}
/* isometric identity */
.iso{width:clamp(320px,34vw,520px);height:auto;display:block;overflow:visible}
.flow{stroke-dasharray:3 6;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-18}}
.fl1{animation:fl 6s ease-in-out infinite}.fl2{animation:fl 7s ease-in-out -2.5s infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.drop{animation:drop 3.6s cubic-bezier(.5,0,.3,1) infinite}
@keyframes drop{0%{transform:translateY(-26px);opacity:0}25%{opacity:1}55%,100%{transform:translateY(0);opacity:1}}
.blink{animation:bl 2.4s ease-in-out infinite}@keyframes bl{50%{opacity:.35}}
/* live demo note */
.guide{display:flex;align-items:center;gap:18px;margin:clamp(28px,5vh,48px) var(--g) 18px;padding-top:16px;border-top:1px solid var(--ink)}
.live{display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.live i{width:7px;height:7px;border-radius:50%;background:#d23b2f;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(210,59,47,.45)}70%,100%{box-shadow:0 0 0 7px rgba(210,59,47,0)}}
.guide p{font-size:14px;color:var(--sub);letter-spacing:-.01em}
.guide p span{display:inline-block;width:20px;height:11px;border:1px dashed rgba(55,98,207,.6);border-radius:3px;vertical-align:-1px;margin:0 4px 0 2px}
.guide .r{margin-left:auto;color:var(--sub)}
.demo{margin:0 var(--g) var(--g);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
#demoFrame{display:block;width:100%;height:100vh;border:0;background:#fff;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:900px){:root{--g:18px}.head{grid-template-columns:1fr}.iso{width:100%}.guide{flex-wrap:wrap}.guide .r{display:none}}
.l2{position:relative;display:inline-block}
.proto{position:absolute;left:calc(100% + 10px);bottom:62%;display:flex;align-items:flex-start;pointer-events:none}
.proto svg{width:52px;height:40px;margin-top:22px;overflow:visible}
.proto svg line{stroke:var(--ink);stroke-width:1}.proto svg circle{fill:var(--ink)}
.pbox{position:relative;margin-top:2px;padding:9px 14px 8px;border:1px solid var(--ink);font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);white-space:nowrap;background:#fff}
.pbox b{position:absolute;left:-1px;bottom:calc(100% + 6px);font-weight:500;font-size:10px;letter-spacing:.08em;color:var(--sub)}
.pbox i{position:absolute;width:6px;height:6px;background:#fff;border:1px solid var(--ink)}
.pbox i:nth-of-type(1){left:-4px;top:-4px}.pbox i:nth-of-type(2){right:-4px;top:-4px}.pbox i:nth-of-type(3){left:-4px;bottom:-4px}.pbox i:nth-of-type(4){right:-4px;bottom:-4px}
@media (max-width:1250px){.proto{left:auto;right:0;bottom:calc(100% - .02em);flex-direction:column;align-items:flex-end}
 .proto svg{order:2;width:1px;height:18px;margin:0 16px 0 0}.proto svg circle{display:none}.proto svg line{x1:0}
 .pbox{order:1;margin:0;padding:7px 11px 6px;font-size:11px}}
@media (max-width:640px){.proto{display:none}}
</style>

:root{
  --ink:#16171c; --t1:#2b3038; --t2:#4b5059; --t3:#6c6f77; --t4:#8b8e95; --ph:#a9acb3;
  --line:#ebedf0; --line2:#e2e4e8; --col:#f2f3f5; --hdr:#f8fafb;
  --blue:#3762cf; --tab:#3557b0; --link:#4a65a0; --green:#3d6b57;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#fff}
body{font-family:&#x27;PretendardEmbed&#x27;,Pretendard,&#x27;Apple SD Gothic Neo&#x27;,&#x27;Malgun Gothic&#x27;,system-ui,sans-serif;color:var(--t1);background:#fff;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:&quot;tnum&quot; 0}
#page{width:2000px;min-height:100vh;background:#fff}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

/* top bar */
.topbar{height:70px;border-bottom:1px solid #efefef;display:flex;align-items:center;padding:0 25px 0 27px}
.crumb{display:flex;align-items:center;font-size:16px;letter-spacing:-.1px}
.crumb .ws{color:#80838a}
.crumb .sl{color:#c4c6cb;margin:0 13px}
.crumb .cur{color:#3c3e45;font-weight:500}
.tr{margin-left:auto;display:flex;align-items:center}
.sync{display:flex;align-items:center;gap:8px;color:var(--green);font-size:15.5px;font-weight:500;letter-spacing:-.2px}
.sync svg{width:16px;height:16px}
.worker{font-size:12px;color:#7c818d;margin-left:16px;letter-spacing:-.2px}
.tbtn{height:35px;padding:0 10px;border:1px solid #e3e5e9;border-radius:8px;font-size:12px;color:#3d4048;margin-left:9px;background:#fff;display:flex;align-items:center}
.tbtn.first{margin-left:9px}
.cal{margin-left:50px;height:38px;padding:0 14px 0 13px;border:1px solid #e7ebf2;border-radius:20px;display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:#3c4f86;background:#fff;box-shadow:0 4px 14px rgba(40,60,110,.09);letter-spacing:-.2px}
.cal svg{width:17px;height:17px}

/* heading */
.head{padding:28px 25px 0 21px;position:relative}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.16em;color:#8a8c96}
.h1row{display:flex;align-items:center;margin-top:19px}
.h1row h1{font-size:34px;font-weight:700;letter-spacing:-.9px;color:var(--ink);line-height:1.15}
.cnt{margin-left:13px;font-size:17px;font-weight:500;color:#34363e;background:#f1f2f6;border-radius:6px;padding:3px 9px 3px;line-height:22px}
.desc{margin-top:15px;font-size:16px;color:#717278;letter-spacing:-.2px}
.stat{display:flex;align-items:center;margin-top:27px}
.stat svg{width:16px;height:16px;margin-right:10px}
.stat .l{font-size:15px;color:#7d8087}
.stat .n{font-size:19px;font-weight:700;color:#2d2f3a;margin-left:10px;letter-spacing:.2px}
.actions{position:absolute;right:25px;top:58px;display:flex;gap:9px}
.btn{height:48px;border-radius:5px;display:flex;align-items:center;font-size:16px;letter-spacing:-.2px}
.btn.dl{border:1px solid #e3e4e7;background:#fff;color:#33363d;padding:0 15px 0 16px;gap:9px;font-weight:500}
.btn.dl svg{width:16px;height:16px}
.btn.add{background:var(--blue);color:#fff;font-weight:700;padding:0 15px 0 17px;gap:9px;box-shadow:0 1px 2px rgba(30,60,160,.2)}
.btn.add svg{width:14px;height:14px}

/* tabs */
.tabs{display:flex;gap:27px;margin:29px 25px 0 21px;border-bottom:2px solid #f3f3f4;height:34px}
.tabs button{font-size:15.4px;color:#82858b;position:relative;height:34px;padding-top:0;align-self:flex-start;line-height:20px;letter-spacing:-.2px}
.tabs button.on{color:var(--tab);font-weight:600}
.tabs button.on::after{content:&quot;&quot;;position:absolute;left:0;right:0;bottom:-2px;height:3px;background:var(--tab);border-radius:2px}

/* controls */

.gcard{position:absolute;width:max-content;min-width:300px;max-width:min(500px,calc(100vw - 28px));background:rgba(16,17,20,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;border-radius:2px;padding:12px 16px 14px;
  font-family:&#x27;PretendardEmbed&#x27;,Pretendard,system-ui,sans-serif;word-break:keep-all;box-shadow:0 18px 40px -20px rgba(0,0,0,.45);
